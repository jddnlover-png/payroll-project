name: Encrypted database backup

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payroll-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 24

      - name: Create, verify, and encrypt backup
        id: backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p backup-output
          plain="backup-output/payroll-${stamp}.dump"
          encrypted="${plain}.enc"
          docker run --rm \
            -v "$PWD/backup-output:/backup" \
            postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges --file="/backup/$(basename "$plain")"
          docker run --rm \
            -v "$PWD/backup-output:/backup:ro" \
            postgres:17-alpine \
            pg_restore --list "/backup/$(basename "$plain")" >/dev/null
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$plain" -out "$encrypted" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          sha256sum "$encrypted" >"${encrypted}.sha256"
          printf '{"createdAt":"%s","format":"pg_dump-custom+aes-256-cbc","source":"payroll-system"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"backup-output/metadata.json"
          sudo shred -u "$plain"
          echo "artifact_name=payroll-db-${stamp}" >>"$GITHUB_OUTPUT"

      - name: Restore into an isolated empty PostgreSQL database
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          container="payroll-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restored_dump="$(mktemp /tmp/payroll-restore-XXXXXX.dump)"
          cleanup() {
            sudo shred -u "$restored_dump" 2>/dev/null || rm -f "$restored_dump"
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          encrypted="$(find backup-output -maxdepth 1 -type f -name '*.dump.enc' -print -quit)"
          test -n "$encrypted"
          sha256sum --check "${encrypted}.sha256"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$encrypted" -out "$restored_dump" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          restore_password="$(openssl rand -hex 24)"
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD="$restore_password" \
            -e POSTGRES_DB=payroll_restore_check \
            postgres:17-alpine >/dev/null
          stable_ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$container" psql \
              --username=postgres --dbname=payroll_restore_check \
              --command="select 1;" >/dev/null 2>&1; then
              stable_ready=$((stable_ready + 1))
              if [ "$stable_ready" -ge 3 ]; then
                break
              fi
            else
              stable_ready=0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Isolated PostgreSQL did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          docker exec "$container" psql \
            --username=postgres --dbname=payroll_restore_check \
            --set=ON_ERROR_STOP=1 \
            --command="create schema if not exists extensions; create extension if not exists pgcrypto with schema extensions;"
          docker cp "$restored_dump" "$container:/tmp/payroll-restore.dump"
          docker exec "$container" pg_restore \
            --exit-on-error --no-owner --no-privileges \
            --schema=public \
            --username=postgres --dbname=payroll_restore_check \
            /tmp/payroll-restore.dump

          docker exec "$container" psql \
            --username=postgres --dbname=payroll_restore_check \
            --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="select case when every(to_regclass(name) is not null) then 'RESTORE_OK' else 'RESTORE_MISSING_TABLE' end from (values ('public.organizations'), ('public.employees'), ('public.attendance_records'), ('public.payroll_records')) as required(name);" \
            | grep -Fx RESTORE_OK
          docker exec "$container" psql \
            --username=postgres --dbname=payroll_restore_check \
            --set=ON_ERROR_STOP=1 \
            --command="select 'organizations' as table_name, count(*) as row_count from public.organizations union all select 'employees', count(*) from public.employees union all select 'attendance_records', count(*) from public.attendance_records union all select 'payroll_records', count(*) from public.payroll_records;"

          docker exec "$container" rm -f /tmp/payroll-restore.dump
          sudo shred -u "$restored_dump"
          restored_dump="/tmp/payroll-restore-already-removed"
          echo "Encrypted backup restored and core payroll tables verified in an isolated database."

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: backup-output/
          if-no-files-found: error
          retention-days: 7

      - name: Ensure plaintext was removed
        shell: bash
        run: |
          set -euo pipefail
          if find backup-output -type f -name '*.dump' | grep -q .; then
            echo "Plaintext backup remains" >&2
            exit 1
          fi
